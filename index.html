<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Landmarker</title>
  <style>
    /* สีธีม */
    
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --line: #262b36;
      --text: #e7ebf2;
      --muted: #8b93a3;
      --accent: #4de3c1;
      --danger: #ff6b6b;
      --ok: #6bffb0;
    }
    /* Reset CSS */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Sarabun", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    header { text-align: center; margin-bottom: 18px; max-width: 640px; }
    h1 { font-size: 1.9rem; letter-spacing: -0.02em; margin-bottom: 6px; }
    h1 span { color: var(--accent); }
    header p { color: var(--muted); font-size: 0.95rem; }

    /* แถบเลือกโหมด = เมนู 1/2 ใน Python */
    .tabs {
      display: flex;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 16px;
    }
    .tab {
      padding: 9px 22px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .tab.active { background: var(--accent); color: #05201b; }

    /* แถบตั้งค่า จำนวนหน้า */
    .settings {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .settings input {
      width: 74px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      text-align: center;
    }
    /* เวทีแสดงผล = cv2.imshow */
    /* mirror = cv2.flip */
    .stage {
      position: relative;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 4 / 3;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video, #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #video { object-fit: cover; }
    /* mirror เฉพาะโหมดกล้อง = cv2.flip */
    .mirror #video, .mirror #overlay { transform: scaleX(-1); }
    #imageCanvas { max-width: 100%; max-height: 100%; }

    /* ข้อความมุมบนซ้าย = cv2.putText */
    .badge {
      position: absolute;
      top: 12px; left: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      background: rgba(0,0,0,0.55);
      z-index: 3;
      display: none;
    }
    /* แสดงข้อความจำนวนหน้า = cv2.putText */
    .badge.show { display: block; }
    .badge.ok { color: var(--ok); }
    .badge.none { color: var(--danger); }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
      padding: 20px;
      z-index: 2;
    }
    /* ซ่อน placeholder เมื่อโหลดโมเดลเสร็จ */
    .placeholder.hidden { display: none; }
    .spinner {
      width: 26px; height: 26px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ปุ่มควบคุม = cv2.waitKey */
    /* flex-wrap = cv2.resizeWindow */
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button.btn {
      font: inherit;
      font-weight: 600;
      padding: 11px 20px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      transition: 0.15s;
    }
    button.btn:hover:not(:disabled) { border-color: var(--accent); }
    button.btn.primary { background: var(--accent); color: #05201b; border-color: var(--accent); }
    button.btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2em;
      text-align: center;
      max-width: 640px;
    }
    .status.error { color: var(--danger); }

    .hidden-el { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Face <span>Landmarker</span></h1>
    <p>ตรวจจับตาข่ายใบหน้าจากกล้องหรือรูปภาพ ในเบราว์เซอร์</p>
  </header>

  <!-- เลือกโหมด = choice 1/2 -->
  <div class="tabs">
    <button class="tab active" id="tabWebcam" data-mode="webcam">กล้อง (Webcam)</button>
    <button class="tab" id="tabImage" data-mode="image">รูปภาพ (Image)</button>
  </div>

  <!-- จำนวนหน้าสูงสุด = max_faces (1-100) -->
  <div class="settings">
    <label for="maxFaces">จำนวนใบหน้าสูงสุด (1-100):</label>
    <input type="number" id="maxFaces" min="1" max="100" value="4" />
  </div>

  <div class="stage mirror" id="stage">
    <div class="badge" id="badge"></div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <canvas id="imageCanvas" class="hidden-el"></canvas>
    <div class="placeholder" id="placeholder">
      <div class="spinner" id="spinner"></div>
      <span id="placeholderText">กำลังโหลดโมเดล...</span>
    </div>
  </div>

  <!-- ปุ่มโหมดกล้อง -->
  <div class="controls" id="webcamControls">
    <button class="btn primary" id="startBtn" disabled>เปิดกล้อง</button>
    <button class="btn" id="stopBtn" disabled>ปิดกล้อง</button>
  </div>

  <!-- ปุ่มโหมดรูปภาพ -->
   /* ปุ่มอัปโหลดรูปภาพ = cv2.imread */
  <div class="controls hidden-el" id="imageControls">
    <button class="btn primary" id="uploadBtn" disabled>เลือกรูปภาพ</button>
    <input type="file" id="fileInput" accept="image/*" class="hidden-el" />
  </div>

  <div class="status" id="status"></div>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const stage = document.getElementById("stage");
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const octx = overlay.getContext("2d");
    const imageCanvas = document.getElementById("imageCanvas");
    const ictx = imageCanvas.getContext("2d");
    const badge = document.getElementById("badge");
    const maxFacesInput = document.getElementById("maxFaces");

    const tabWebcam = document.getElementById("tabWebcam");
    const tabImage = document.getElementById("tabImage");
    const webcamControls = document.getElementById("webcamControls");
    const imageControls = document.getElementById("imageControls");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");

    const statusEl = document.getElementById("status");
    const placeholder = document.getElementById("placeholder");
    const placeholderText = document.getElementById("placeholderText");
    const spinner = document.getElementById("spinner");

    let faceLandmarker;
    let overlayDU, imageDU;
    let mode = "webcam";       // "webcam" | "image"
    let currentRunningMode = "VIDEO";
    let running = false;
    let stream = null;
    let lastVideoTime = -1;

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
    }

    // แสดงข้อความจำนวนหน้า = cv2.putText
    function showBadge(faceCount) {
      if (faceCount > 0) {
        badge.textContent = "พบใบหน้า: " + faceCount;
        badge.className = "badge show ok";
      } else {
        badge.textContent = "ไม่พบใบหน้า";
        badge.className = "badge show none";
      }
    }
    function hideBadge() { badge.className = "badge"; }

    function clampMaxFaces() {
      let n = parseInt(maxFacesInput.value, 10);
      if (isNaN(n) || n < 1) n = 1;
      if (n > 100) n = 100;
      maxFacesInput.value = n;
      return n;
    }

    // 1) โหลดโมเดล
    async function init() {
      try {
        const fileset = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );
        faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numFaces: clampMaxFaces(),
          minFaceDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        overlayDU = new DrawingUtils(octx);
        imageDU = new DrawingUtils(ictx);

        placeholder.classList.add("hidden");
        startBtn.disabled = false;
        uploadBtn.disabled = false;
        setStatus("พร้อมแล้ว เลือกโหมดแล้วเริ่มได้เลย");
      } catch (err) {
        spinner.style.display = "none";
        placeholderText.textContent = "โหลดโมเดลไม่สำเร็จ";
        setStatus("โหลดโมเดลไม่สำเร็จ: " + err.message, true);
      }
    }

    // ให้แน่ใจว่า runningMode ตรงกับโหมดที่ใช้ (VIDEO/IMAGE)
    async function ensureRunningMode(want) {
      if (currentRunningMode !== want) {
        await faceLandmarker.setOptions({ runningMode: want });
        currentRunningMode = want;
      }
    }

    // ===== สลับโหมด =====
    async function switchMode(next) {
      if (next === mode) return;
      mode = next;

      // เคลียร์สถานะโหมดกล้อง
      if (running) stopCamera();
      hideBadge();
      octx.clearRect(0, 0, overlay.width, overlay.height);

      const isWebcam = mode === "webcam";
      tabWebcam.classList.toggle("active", isWebcam);
      tabImage.classList.toggle("active", !isWebcam);
      webcamControls.classList.toggle("hidden-el", !isWebcam);
      imageControls.classList.toggle("hidden-el", isWebcam);

      // แสดง element ให้ตรงโหมด
      video.classList.toggle("hidden-el", !isWebcam);
      overlay.classList.toggle("hidden-el", !isWebcam);
      imageCanvas.classList.toggle("hidden-el", isWebcam);
      stage.classList.toggle("mirror", isWebcam); // รูปภาพไม่ต้อง mirror

      setStatus(isWebcam ? "โหมดกล้อง" : "โหมดรูปภาพ กดเลือกรูปเพื่อตรวจจับ");
    }

    // ===== โหมดกล้อง =====
    async function startCamera() {
      try {
        await ensureRunningMode("VIDEO");
        await faceLandmarker.setOptions({ numFaces: clampMaxFaces() });

        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
        await video.play();

        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;

        running = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        maxFacesInput.disabled = true;
        setStatus("");
        renderLoop();
      } catch (err) {
        setStatus("เปิดกล้องไม่ได้: " + err.message + " (ต้องอนุญาตกล้อง และเปิดผ่าน https)", true);
      }
    }
    /* ปิดกล้อง = cv2.VideoCapture.release() */
    function stopCamera() {
      running = false;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      octx.clearRect(0, 0, overlay.width, overlay.height);
      hideBadge();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      maxFacesInput.disabled = false;
    }
    /* วนลูปประมวลผลกล้อง = cv2.VideoCapture.read() */
    function renderLoop() {
      if (!running) return;
      const now = performance.now();
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, now);

        octx.clearRect(0, 0, overlay.width, overlay.height);
        const faces = results.faceLandmarks || [];
        for (const landmarks of faces) {
          overlayDU.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_TESSELATION,
            { color: "#ffffff", lineWidth: 1 });
        }
        showBadge(faces.length);
      }
      requestAnimationFrame(renderLoop);
    }

    // ===== โหมดรูปภาพ =====
    // ประมวลผลรูปภาพที่อัปโหลด
    async function handleImage(file) {
      try {
        await ensureRunningMode("IMAGE");
        await faceLandmarker.setOptions({ numFaces: clampMaxFaces() });

        const img = new Image();
        img.onload = () => {
          imageCanvas.width = img.naturalWidth;
          imageCanvas.height = img.naturalHeight;
          ictx.drawImage(img, 0, 0);

          const results = faceLandmarker.detect(img);
          const faces = results.faceLandmarks || [];
          for (const landmarks of faces) {
            imageDU.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_TESSELATION,
              { color: "#ffffff", lineWidth: 1 });
          }
          showBadge(faces.length);
          URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(file);
        setStatus("");
      } catch (err) {
        setStatus("ประมวลผลรูปไม่สำเร็จ: " + err.message, true);
      }
    }

    // ===== events =====
    /* สลับโหมด = cv2.waitKey */
    tabWebcam.addEventListener("click", () => switchMode("webcam"));
    tabImage.addEventListener("click", () => switchMode("image"));
    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    uploadBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      if (e.target.files[0]) handleImage(e.target.files[0]);
    });

    init();
  </script>
</body>
</html>
